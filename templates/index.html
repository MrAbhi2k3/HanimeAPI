{% extends "base.html" %}

{% block content %}
<section class="hero bg-gray-800 rounded-lg p-8 mb-12">
    <div class="max-w-3xl mx-auto text-center">
        <h1 class="text-4xl font-bold mb-4">Hanime API</h1>
        <p class="text-xl mb-8 text-gray-300">{{ description }}</p>
        <div class="flex justify-center space-x-4">
            <b class="bg-purple-600 hover:bg-purple-700 px-6 py-3 rounded-lg font-medium">
                <i class="fas fa-search mr-2"></i> Search Videos
            </b>
            <b class="bg-gray-700 hover:bg-gray-600 px-6 py-3 rounded-lg font-medium">
                <i class="fas fa-clock mr-2"></i> Recent Videos
            </b>
        </div>
    </div>
</section>

<section>
    <h2 class="text-2xl font-bold mb-6">API Endpoints</h2>
    <div class="grid md:grid-cols-2 gap-6">
        {% for endpoint in endpoints %}
        <div class="bg-gray-800 p-6 rounded-lg hover:bg-gray-700 transition">
            <h3 class="text-xl font-semibold mb-2 text-purple-400">{{ endpoint.name }}</h3>
            <code class="bg-gray-900 px-2 py-1 rounded text-sm mb-3 inline-block">{{ endpoint.path }}</code>
            <p class="text-gray-300">{{ endpoint.description }}</p>
        </div>
        {% endfor %}
    </div>
</section>
{% endblock %}
